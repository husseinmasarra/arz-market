# Nginx Configuration for ArzMart (https://arzmart.com)

server {
    listen 80;
    listen [::]:80;
    server_name arzmart.com www.arzmart.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arzmart.com www.arzmart.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/arzmart.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arzmart.com/privkey.pem;

    # Performance & Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;

    client_max_body_size 100M;

    # Static Assets Caching
    location /assets/ {
        alias /var/www/arzmart/frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded Product Media
    location /uploads/ {
        alias /var/www/arzmart/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # API & Node Application (with WebSocket support)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
